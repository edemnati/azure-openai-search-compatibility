[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azure-openai-search-compatibility"
version = "0.1.0"
description = "OpenAI-compatible replacement for Azure OpenAI On Your Data using Azure AI Search"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "azure",
    "azure-openai",
    "azure-ai-search",
    "rag",
    "on-your-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "azure-identity>=1.15.0",
    "azure-search-documents>=11.6.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
evaluation = [
    "azure-ai-evaluation>=1.18.7",
]
dev = [
    "azure-ai-evaluation>=1.18.7",
    "build>=1.2.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/azure_openai_search_compat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "environment: requires live Azure resources and credentials",
    "evaluation: runs Foundry evaluators and can incur model charges",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["azure_openai_search_compat"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
